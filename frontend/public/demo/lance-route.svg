<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="两周通关路线示意图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3ef"/>
      <stop offset="0.55" stop-color="#f8e3e6"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e06a86"/>
      <stop offset="1" stop-color="#c2486d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7a4a5c" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="120" cy="90" r="120" fill="#ffffff" opacity="0.45"/>
  <circle cx="860" cy="460" r="160" fill="#ffffff" opacity="0.35"/>
  <path d="M-20 420 C 180 350 260 470 470 430 S 760 350 980 410" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <text x="48" y="64" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="13" letter-spacing="4" fill="#a37484">ROUTE MAP</text>
  <text x="48" y="104" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#3b2b33">两周通关路线</text>
  <text x="48" y="132" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8a6f7a">自由都市 → 利萨斯 → 赛斯 → 赫尔曼 → 最终决战</text>

  <g filter="url(#soft)">
    <rect x="80" y="180" width="170" height="86" rx="22" fill="#ffffff" opacity="0.92"/>
    <text x="165" y="216" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#3b2b33">自由都市</text>
    <text x="165" y="240" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="11" fill="#9b7f8a">支线清完 · 第 1–4 天</text>

    <rect x="330" y="120" width="170" height="86" rx="22" fill="#ffffff" opacity="0.92"/>
    <text x="415" y="156" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#3b2b33">利萨斯</text>
    <text x="415" y="180" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="11" fill="#9b7f8a">主线推进 · 第 5–7 天</text>

    <rect x="560" y="238" width="170" height="86" rx="22" fill="#ffffff" opacity="0.92"/>
    <text x="645" y="274" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#3b2b33">赛斯</text>
    <text x="645" y="298" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="11" fill="#9b7f8a">爬塔 · 第 8–11 天</text>

    <rect x="700" y="120" width="170" height="86" rx="22" fill="#ffffff" opacity="0.92"/>
    <text x="785" y="156" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#3b2b33">赫尔曼</text>
    <text x="785" y="180" text-anchor="middle" font-family="'Noto Sans SC',sans-serif" font-size="11" fill="#9b7f8a">收尾 · 第 12–14 天</text>
  </g>

  <path d="M245 220 C 280 190 300 170 330 165" fill="none" stroke="url(#route)" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M500 165 C 540 190 545 235 560 268" fill="none" stroke="url(#route)" stroke-width="3" stroke-dasharray="7 7"/>
  <path d="M730 238 C 760 205 765 175 770 165" fill="none" stroke="url(#route)" stroke-width="3" stroke-dasharray="7 7"/>

  <g font-family="'Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#ffffff">
    <circle cx="262" cy="196" r="14" fill="#d4647f"/><text x="262" y="201" text-anchor="middle">1</text>
    <circle cx="516" cy="204" r="14" fill="#d4647f"/><text x="516" y="209" text-anchor="middle">2</text>
    <circle cx="745" cy="220" r="14" fill="#d4647f"/><text x="745" y="225" text-anchor="middle">3</text>
  </g>

  <g filter="url(#soft)">
    <rect x="80" y="410" width="360" height="74" rx="18" fill="#ffffff" opacity="0.9"/>
    <text x="104" y="440" font-family="'Noto Sans SC',sans-serif" font-size="12" fill="#9b7f8a">FINAL BATTLE</text>
    <text x="104" y="464" font-family="'Noto Sans SC',sans-serif" font-size="17" font-weight="700" fill="#3b2b33">最终决战 · 第 15 天 02:14</text>
  </g>
</svg>
