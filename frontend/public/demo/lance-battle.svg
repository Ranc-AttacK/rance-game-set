    <text x="76" y="184" font-size="11" fill="#8a93b0">HP</text>
    <rect x="104" y="174" width="420" height="14" rx="7" fill="#ffffff" opacity="0.1"/>
    <rect x="104" y="174" width="238" height="14" rx="7" fill="url(#enemyHp)"/>
    <text x="530" y="186" text-anchor="end" font-size="11" fill="#c9d2e6">43%</text>

    <rect x="52" y="232" width="330" height="130" rx="16" fill="#0b0e18" opacity="0.72" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="76" y="262" font-size="13" font-weight="700" fill="#f4f1ea">兰斯</text>
    <text x="76" y="286" font-size="11" fill="#8a93b0">HP 1420 / 1620</text>
    <rect x="76" y="296" width="282" height="10" rx="5" fill="#ffffff" opacity="0.1"/>
    <rect x="76" y="296" width="248" height="10" rx="5" fill="#e0557c"/>
    <text x="76" y="326" font-size="11" fill="#8a93b0">状态：攻击强化 · 连击准备</text>
    <text x="76" y="348" font-size="11" fill="#8a93b0">回合：12</text>

    <rect x="52" y="392" width="856" height="112" rx="18" fill="#0b0e18" opacity="0.8" stroke="#ffffff" stroke-opacity="0.08"/>
    <g fill="#f4f1ea" font-size="14" font-weight="700">
      <rect x="76" y="416" width="180" height="64" rx="12" fill="#e0557c"/>
      <text x="166" y="454" text-anchor="middle">兰斯斩</text>
      <rect x="276" y="416" width="180" height="64" rx="12" fill="#ffffff" opacity="0.1"/>
      <text x="366" y="454" text-anchor="middle">全体治愈</text>
      <rect x="476" y="416" width="180" height="64" rx="12" fill="#ffffff" opacity="0.1"/>
      <text x="566" y="454" text-anchor="middle">陨石术</text>
      <rect x="676" y="416" width="208" height="64" rx="12" fill="#ffffff" opacity="0.1"/>
      <text x="780" y="454" text-anchor="middle">防御 / 道具</text>
