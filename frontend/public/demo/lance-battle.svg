<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="最终决战战斗界面示意图">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141827"/>
      <stop offset="0.6" stop-color="#2a2140"/>
      <stop offset="1" stop-color="#4a2438"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f08fa6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f08fa6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="enemyHp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b8a2"/>
      <stop offset="1" stop-color="#dd5f5f"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#field)"/>
  <circle cx="700" cy="210" r="190" fill="url(#aura)"/>
  <path d="M0 420 L960 360 L960 540 L0 540 Z" fill="#0d101b" opacity="0.55"/>

  <g opacity="0.9">
    <path d="M640 380 C 620 300 650 240 700 220 C 760 240 780 320 760 380 Z" fill="#231a2e" stroke="#f08fa6" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M680 250 C 690 220 710 220 720 250" fill="none" stroke="#f08fa6" stroke-opacity="0.6" stroke-width="3"/>
    <circle cx="688" cy="278" r="5" fill="#f08fa6"/>
    <circle cx="722" cy="278" r="5" fill="#f08fa6"/>
  </g>

  <text x="52" y="60" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12" letter-spacing="4" fill="#8a93b0">FINAL BATTLE</text>
  <text x="52" y="96" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#f4f1ea">最终决战 · 第 3 阶段</text>

  <g font-family="'Noto Sans SC',sans-serif">
    <rect x="52" y="130" width="500" height="74" rx="16" fill="#0b0e18" opacity="0.72" stroke="#ffffff" stroke-opacity="0.08"/>
