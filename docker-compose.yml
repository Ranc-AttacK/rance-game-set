services:
  mysql:
    image: mysql:8.0
    container_name: gal-mysql
    environment:
      MYSQL_DATABASE: gal
      MYSQL_USER: gal
      MYSQL_PASSWORD: galpass
      MYSQL_ROOT_PASSWORD: rootpass
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: gal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: gal-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Mailpit is a MailHog-compatible dev SMTP sink (same 1025/8025 ports).
  # It replaces MailHog because the MailHog image pull stalls on the available registry mirror.
  mailpit:
    image: axllent/mailpit:latest
    container_name: gal-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
  minio-data:
