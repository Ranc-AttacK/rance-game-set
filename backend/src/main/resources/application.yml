spring:
  application:
    name: gal-community
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gal}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:gal}
    password: ${DB_PASSWORD:galpass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
  # event_publication is owned by Flyway (V0); the Modulith JPA starter validates it and does not auto-create it.

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  trusted-proxies: "${APP_TRUSTED_PROXIES:127.0.0.1/32,::1/128}"
  bootstrap-admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  jwt:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:}
    issuer: gal-community
    access-ttl: PT30M
    refresh-ttl: P7D
    require-configured-keys: ${JWT_REQUIRE_CONFIGURED_KEYS:false}
  cookie:
    secure: ${COOKIE_SECURE:false}
  email:
    dispatch-enabled: ${EMAIL_DISPATCH_ENABLED:true}
    poll-interval-ms: 5000
    from: ${MAIL_FROM:no-reply@gal.local}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
